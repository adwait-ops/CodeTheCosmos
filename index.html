<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Evolution Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 300px;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            min-width: 250px;
        }

        input,
        button {
            margin: 5px 0;
            padding: 8px;
            width: 100%;
        }

        button {
            background: #604a86;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            padding: 8px;
        }

        button:hover {
            background: #45a049;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .info-item {
            margin: 10px 0;
        }

        .info-label {
            font-weight: bold;
            color: #4CAF50;
        }
    </style>
</head>

<body>


    <div id="controls">
        <h2>Stellar Parameters</h2>
        <label>Mass (M☉): <input type="number" id="mass-input" value="1.0" step="0.1" min="0.1" max="100"></label>
        <label>Metallicity (Z): <input type="number" id="metallicity-input" value="0.02" step="0.001" min="0.0001"
                max="0.03"></label>
        <label>Hydrogen (X): <input type="number" id="hydrogen-input" value="0.7" step="0.01" min="0.5"
                max="0.8"></label>

        <button id="initialize-btn">Initialize Star</button>
        <button id="start-btn" disabled>Start Evolution</button>
        <button id="pause-btn" disabled>Pause Evolution</button>

        <div id="status" style="margin-top: 10px; font-size: 12px;"></div>
    </div>

    <div id="info-panel">
        <h2>Current State</h2>
        <div class="info-item">
            <span class="info-label">Radius:</span> <span id="radius-display">-</span> R☉
        </div>
        <div class="info-item">
            <span class="info-label">Luminosity:</span> <span id="luminosity-display">-</span> L☉
        </div>
        <div class="info-item">
            <span class="info-label">Temperature:</span> <span id="temperature-display">-</span> K
        </div>
        <div class="info-item">
            <span class="info-label">Age:</span> <span id="age-display">-</span> years
        </div>
        <div class="info-item">
            <span class="info-label">Mass:</span> <span id="mass-display">-</span> M☉
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Include libraries -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/controls/OrbitControls.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.121.1/examples/js/controls/OrbitControls.js"></script>
    <script src="stellar-visualization.js"></script>
</body>

</html>
